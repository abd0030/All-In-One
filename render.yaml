services:
  - type: web
    name: all-in-one-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAFEPAY_API_KEY
        sync: false
      - key: SAFEPAY_MERCHANT_KEY
        sync: false
      - key: SAFEPAY_ENV
        value: sandbox
